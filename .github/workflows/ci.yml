name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly dependency audit
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: bash -n start.sh && node --check gate.js && node --check derive-tools.js
      - run: npm test
      - name: image builds
        run: docker build -t m365-claude-relay:ci .
