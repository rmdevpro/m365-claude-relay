name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  softeria-config:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/softeria/ms-365-mcp-server@sha256:0e063c40f809448c184d55597db2b7a879a14d279f11c9cde881e411fbe056ec
    steps:
      - uses: actions/checkout@v4
      - name: Relay configuration with placeholder credentials
        run: |
          sed -e 's#<application (client) id>#00000000-0000-0000-0000-000000000001#' \
              -e 's#<SECRET: client secret>#placeholder#' \
              -e 's#<directory (tenant) id, or consumers for personal accounts>#consumers#' \
              -e '/^MS365_MCP_ORG_MODE=/d' \
              -e 's#https://<relay host>#http://127.0.0.1:3000#' \
              -e "s#<SECRET: 64 random hex characters.*#$(openssl rand -hex 32)#" \
              -e 's#<the same tenant id; personal accounts: 9188040d-6c67-4c5b-b112-36a304b66dad>#9188040d-6c67-4c5b-b112-36a304b66dad#' \
              relay.env.example > relay.env
          grep -vE '^(MS365_MCP_OBO|MS365_MCP_CLIENT_SECRET)=' relay.env > plain.env
      - name: Start the relay (OBO) and a plain instance for the tool surface
        run: |
          docker run -d --name relay --env-file relay.env -p 127.0.0.1:3000:3000 $IMAGE --http 0.0.0.0:3000 --enable-attachment-urls
          docker run -d --name plain --env-file plain.env -p 127.0.0.1:3001:3000 $IMAGE --http 0.0.0.0:3000
          for i in $(seq 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && curl -sf http://127.0.0.1:3001/ >/dev/null && break; sleep 1; done
      - name: Outside checks
        run: ./test/smoke.sh http://127.0.0.1:3000
      - name: Tool surface (138 with the default scopes, superseded tools excluded)
        run: |
          out=$(python3 test/tools.py http://127.0.0.1:3001/mcp); echo "$out"
          echo "$out" | grep -q '^138 tools | read-mail-text: True | get-download-url: True | get-upload-url: True | excluded present: \[\]$'
      - if: failure()
        run: docker logs relay 2>&1 | tail -50
