name: release
# Tag v* → build multi-arch image, push to GHCR, sign (cosign keyless), attach SBOM + provenance.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: summary
        run: echo "Published ${IMAGE}@${{ steps.build.outputs.digest }} (${{ steps.meta.outputs.tags }})" >> "$GITHUB_STEP_SUMMARY"
