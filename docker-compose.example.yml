# Example: our build of Softeria's server (see README), configured as a Claude relay. Put TLS in front of port 3000.
services:
  m365-relay:
    image: ghcr.io/rmdevpro/ms-365-mcp-server@sha256:456eb842902d32a5b95cdaff2f0db523dffa89af0abb11e4698c6af9c03bcf88  # Softeria 0.176.0 + #775, #777
    command: ["--http", "0.0.0.0:3000", "--enable-attachment-urls"]
    env_file: relay.env
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
